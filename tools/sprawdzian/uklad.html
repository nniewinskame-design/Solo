<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sprawdzian układu · Solo TEST</title>
<style>
body{margin:0;background:#F4EEE4;color:#1E1714;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px 16px 60px}
main{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:26px}
.muted{color:#6E625A}
button{font:600 16px inherit;padding:12px 18px;border-radius:12px;border:0;background:#4B1622;color:#fff;cursor:pointer}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}
td,th{padding:6px 10px;border-top:1px solid #eee;text-align:left;vertical-align:top;font-size:14px}
.ok{color:#0B7A5E;font-weight:700}.bad{color:#C93A2E;font-weight:700}
#frames{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
iframe{border:1px solid #ccc;border-radius:10px;background:#fff;height:700px}
</style>
</head>
<body>
<main>
  <h1>Sprawdzian układu</h1>
  <p class="muted">Otwiera Solo w kilku szerokościach (telefony 360–430 px, tablet), z większym tekstem, przechodzi przez ekrany i arkusze i sprawdza: czy coś na siebie nachodzi, czy ostatnią linię nut da się przewinąć nad dolny pasek. Tylko strona testowa.</p>
  <div><button id="run">Sprawdź układ</button> <span id="st" class="muted"></span></div>
  <table id="out"><tr><th>Szerokość</th><th>Ekran</th><th>Wynik</th><th>Szczegóły</th></tr></table>
  <div id="frames"></div>
</main>
<script>
"use strict";
const WIDTHS = [360, 390, 412, 430, 768];
const wait = ms => new Promise(r => setTimeout(r, ms));
/* every visible thing a person reads or taps */
function things(doc, root) {
  const sel = "button, a, input, select, label.li, .li, h1, h2, h3, p, .tool, .pill, .notice, .peek, .tile";
  return [...(root || doc).querySelectorAll(sel)].filter(el => {
    if (el.closest("[hidden]") || el.closest(".pages") || el.closest("#tabbar")) return false;   // the library scrolls under the see-through tab bar on purpose
    const r = el.getBoundingClientRect(), cs = doc.defaultView.getComputedStyle(el);
    return r.width > 2 && r.height > 2 && cs.visibility !== "hidden" && cs.opacity !== "0" && cs.display !== "none";
  });
}
function overlaps(doc, root) {
  const els = things(doc, root), bad = [];
  for (let i = 0; i < els.length; i++) for (let j = i + 1; j < els.length; j++) {
    const a = els[i], b = els[j];
    if (a.contains(b) || b.contains(a)) continue;
    const r = a.getBoundingClientRect(), s = b.getBoundingClientRect();
    const w = Math.min(r.right, s.right) - Math.max(r.left, s.left), h = Math.min(r.bottom, s.bottom) - Math.max(r.top, s.top);
    if (w > 3 && h > 3) bad.push(`${label(a)} ↔ ${label(b)}`);
  }
  return bad;
}
const label = el => (el.id ? "#" + el.id : el.tagName.toLowerCase() + (el.className && typeof el.className === "string" ? "." + el.className.split(" ")[0] : "")) + (el.textContent.trim() ? ` „${el.textContent.trim().slice(0, 18)}”` : "");
function row(w, screen, ok, det) {
  const tr = document.createElement("tr");
  tr.innerHTML = `<td>${w}px</td><td>${screen}</td><td class="${ok ? "ok" : "bad"}">${ok ? "w porządku" : "do poprawy"}</td><td>${det}</td>`;
  document.getElementById("out").appendChild(tr);
  window.RESULTS = window.RESULTS || []; window.RESULTS.push({ w, screen, ok, det });
}
async function check(w) {
  const f = document.createElement("iframe"); f.width = w; f.src = "./?layoutcheck=" + w;
  document.getElementById("frames").appendChild(f);
  await new Promise(r => f.onload = r); await wait(1500);
  const W = f.contentWindow, D = f.contentDocument;
  D.documentElement.style.fontSize = "112%";                      // a larger text setting
  try { W.hideWelcome && W.hideWelcome(); } catch {}
  await wait(400);
  let o = overlaps(D); row(w, "Biblioteka", !o.length, o.slice(0, 4).join("; ") || "–");
  D.querySelector('[data-act="example"]').click(); await wait(3500);
  o = overlaps(D, D.getElementById("score")); row(w, "Nuty", !o.length, o.slice(0, 4).join("; ") || "–");
  const sc = D.getElementById("scroller"), dock = D.getElementById("dock");
  sc.scrollTop = sc.scrollHeight; await wait(500);
  const ms = D.querySelectorAll("#pages g.measure"), last = ms[ms.length - 1];
  const under = last && last.getBoundingClientRect().bottom > dock.getBoundingClientRect().top - 4;
  row(w, "Ostatnia linia nad paskiem", !under, under ? "ostatni takt pod paskiem" : "–");
  for (const sh of ["clef", "key", "more", "practice", "tools", "tuner", "share", "bar"]) {
    W.openSheet(sh); await wait(900);
    const el = D.getElementById("sh-" + sh);
    o = overlaps(D, el); const r = el.getBoundingClientRect();
    const off = r.top < 0 ? "arkusz wychodzi poza ekran" : "";
    row(w, "Arkusz " + sh, !o.length && !off, [off, ...o.slice(0, 4)].filter(Boolean).join("; ") || "–");
    W.closeSheet(); await wait(700);
  }
  D.getElementById("btn-edit").click(); await wait(2500);
  const note = D.querySelector("#pages g.note"); if (note) { note.dispatchEvent(new MouseEvent("click", { bubbles: true, clientX: note.getBoundingClientRect().x + 2, clientY: note.getBoundingClientRect().y + 2 })); await wait(1200); }
  const eb = D.getElementById("editbar"), ebr = eb.getBoundingClientRect(), off = ebr.bottom > W.innerHeight + 1 || ebr.left < -1 || ebr.right > W.innerWidth + 1;
  o = overlaps(D, eb);
  row(w, "Poprawianie nut", !eb.hidden && !off && !o.length, eb.hidden ? "panel się nie pojawił" : off ? "panel wychodzi poza ekran" : (o.slice(0, 4).join("; ") || "–"));
  D.getElementById("btn-edit").click(); await wait(1500);
  f.remove();
}
document.getElementById("run").addEventListener("click", async () => {
  window.RESULTS = [];
  try { localStorage.setItem("solo:tourDone", "1"); localStorage.setItem("solo:welcomed", "1"); localStorage.setItem("solo:newsSeen", "3.8"); localStorage.setItem("solo:profile", JSON.stringify({ instruments: ["puzon"], main: "puzon", reading: "written", role: "teacher", a4: 440, done: true })); } catch {}
  for (const w of WIDTHS) { document.getElementById("st").textContent = `Sprawdzam ${w}px…`; try { await check(w); } catch (e) { row(w, "błąd", false, String(e && e.message || e)); } }
  const bad = window.RESULTS.filter(r => !r.ok).length;
  document.getElementById("st").textContent = bad ? `Do poprawy: ${bad}` : "Wszystko w porządku.";
  window.DONE = true;
});
</script>
</body>
</html>
